[project]
name = "market-view"
version = "0.1.0"
description = "Personal AI-assisted trading research, backtesting and paper-trading platform for Indian equities (NSE)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "yfinance>=0.2.50",
    "requests>=2.32",
    "plotly>=5.22",
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "python-dateutil>=4.0.0",
]

[project.scripts]
market-view = "market_view.server:cli"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "playwright>=1.55",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_view"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
