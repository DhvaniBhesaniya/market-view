# Backtest & validation settings — see docs/06-strategies-and-validation.md

initial_capital: 500000          # simulated Rs 5 lakh
data_source: yfinance            # yfinance | upstox
interval: 1d
benchmark: NIFTY50
volatility_index: INDIAVIX
warmup_days: 300                 # extra history loaded before each period for indicators

periods:
  train:    {start: "2010-01-01", end: "2019-12-31"}
  validate: {start: "2020-01-01", end: "2022-12-31"}
  test:     {start: "2023-01-01", end: "2025-12-31"}   # LOCKED: needs --unlock-test, run once per version
  forward:  {start: "2026-01-01", end: null}          # paper trading period
  full:     {start: "2010-01-01", end: "2022-12-31"}  # research = train + validate (never includes test)

walkforward:
  train_years: 4
  test_years: 1
  first_test_year: 2014
  last_test_year: 2022

montecarlo:
  runs: 1000
  seed: 42
